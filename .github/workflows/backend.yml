name: Backend Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "igokochi_backend/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t ricoharsono/igokochi-backend:${{ env.IMAGE_TAG }} ./igokochi_backend

      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Docker push
        run: docker push ricoharsono/igokochi-backend:${{ env.IMAGE_TAG }}

      # GitOps: update values.yaml in helm-DO repo to trigger helm-deploy pipeline
      - name: Update image tag in Helm chart
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          git clone https://x-access-token:${{ secrets.HELM_REPO_TOKEN }}@github.com/Shuliii/helm-DO.git
          cd helm-DO
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

          for i in 1 2 3 4 5; do
            yq e ".backend.image.tag = \"$IMAGE_TAG\"" -i igokochi/values.yaml
            git add igokochi/values.yaml
            git commit -m "ci: update igokochi backend image tag to $IMAGE_TAG"

            if git push; then
              exit 0
            fi

            echo "Push rejected (attempt $i) — pulling latest and retrying"
            git reset --hard HEAD~1
            git pull --rebase
            sleep $((RANDOM % 5 + 1))
          done

          echo "::error::Failed to push Helm chart update after 5 attempts"
          exit 1
